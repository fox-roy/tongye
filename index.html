<style>
/* Layout: one narrow column, phone first. Library is a plain list of books under a
   "today" strip; the reader is a sticky bar over long-form text, with sheets sliding up
   from the bottom for contents, notes and threads. Two voices: yellow marker = you,
   blue underline = 克总. */
:root {
  --bg: #F1F3EF;
  --surface: #FAFBF8;
  --fg: #1B2220;
  --muted: #5F6A66;
  --line: #D6DBD3;

  --btn-bg: #1B2220;
  --btn-fg: #F1F3EF;
  --danger: #B3402F;
  --scrim: rgba(10, 14, 13, .45);
  --f-display: "ZCOOL XiaoWei", "Noto Serif SC", "Songti SC", serif;
  --f-read: "Noto Serif SC", "Songti SC", "Source Han Serif SC", "SimSun", serif;
  --f-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --fs: 18px;
  --lh: 1.95;
  --pgap: .85em;
  --gut: 16px;
  --align: justify;
  --indent: 2em;
}

  :root:not([data-theme="light"]) {
    --bg: #0E1315;
    --surface: #162023;
    --fg: #D9DFDA;

    --line: #26312F;
    --me-bg: rgba(232, 194, 52, .30);
    --me-ink: #E8C234;
    --ai-bg: rgba(109, 180, 207, .16);
    --ai-ink: #7FBDD6;
    --ai-line: #6DB4CF;
    --h0: #1C2729; --h1: #1F3B47; --h2: #285468; --h3: #3A7A93; --h4: #6DB4CF;
    --btn-bg: #D9DFDA;
    --btn-fg: #0E1315;
    --danger: #E5806F;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1315;
  --surface: #162023;
  --fg: #D9DFDA;
  --muted: #8B9792;
  --line: #26312F;
  --me-bg: rgba(232, 194, 52, .30);
  --me-ink: #E8C234;
  --ai-bg: rgba(109, 180, 207, .16);
  --ai-ink: #7FBDD6;
  --ai-line: #6DB4CF;
    --h0: #1C2729; --h1: #1F3B47; --h2: #285468; --h3: #3A7A93; --h4: #6DB4CF;

}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }

button, input, textarea { font: inherit; color: inherit; }

.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* buttons */
.btn { font: 500 14px/1.2 var(--f-ui); border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 10px 14px; min-height: 40px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }

/* library */
#lib { padding-block: 28px 120px; max-width: 920px; }

.lib-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 8px; }

.today { padding: 14px 0 18px; border-block: 1px solid var(--line); margin-bottom: 8px; display: grid; gap: 10px; }

.empty { padding: 36px 0 12px; display: grid; gap: 10px; }

.empty p { color: var(--muted); max-width: 30em; }
.addbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 20; }
.addbar .in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }

/* reader */
#reader { padding-bottom: 140px; }
.rbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

#paras p.fh { font-weight: 600; text-indent: 0; margin: 1.2em 0 .6em; line-height: 1.5; text-align: left; break-after: avoid; }

.fnpop { position: fixed; z-index: 60; width: min(86vw, 340px); max-height: 42vh; overflow: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.28); font: 400 14px/1.7 var(--f-ui); animation: fnin .18s ease-out both; }

#paras p { font: 400 var(--fs)/var(--lh) var(--f-read); text-indent: var(--indent); margin: 0 0 var(--pgap); overflow-wrap: anywhere; text-align: var(--align); }
mark.hl { color: inherit; background: none; border-radius: 2px; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.selbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.selbar .in { max-width: 680px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.selbar .in { gap: 6px; }
.selbar { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.selbar .btn { white-space: nowrap; padding: 8px 10px; min-height: 40px; flex: none; }

/* polish: scrubber, page chrome, micro-interactions */
#scrub .srange { position: relative; height: 26px; display: grid; align-items: center; }
#scrub input { -webkit-appearance: none; appearance: none; background: transparent; height: 26px; position: relative; z-index: 1; cursor: pointer; }
#scrub input::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--ai-line) var(--p, 0%), var(--line) var(--p, 0%)); }

.rprog i { position: relative; transition: width .3s ease; }

.btn { transition: transform .12s ease, border-color .15s ease, background-color .15s ease; }

/* sheets */

.inp { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }

.pgview, .flow { display: contents; }

}

const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('tongye', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const rq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const wrap = e => ({ code: e && e.name === 'QuotaExceededError' ? 'quota_exceeded' : 'unavailable', message: String((e && e.message) || e) });
  const st = async mode => (await open()).transaction('kv', mode).objectStore('kv');
  const kvGet = async p => { try { return await rq((await st('readonly')).get(p)); } catch (e) { throw wrap(e); } };
  const kvPut = async (p, v) => { try { await rq((await st('readwrite')).put(v, p)); } catch (e) { throw wrap(e); } };
  const kvDel = async p => { try { await rq((await st('readwrite')).delete(p)); } catch (e) { throw wrap(e); } };
  const kvKeys = async pre => { try { return await rq((await st('readonly')).getAllKeys(IDBKeyRange.bound(pre, pre + '￿'))); } catch (e) { throw wrap(e); } };
  const clone = o => JSON.parse(JSON.stringify(o));
  const merge = (a, b) => {
    for (const k of Object.keys(b)) {
      if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], b[k]);
      else a[k] = b[k];
    }
    return a;
  };
  const snapOf = (path, v) => ({ id: path.slice(path.lastIndexOf('/') + 1), exists: v !== undefined, data: () => (v === undefined ? undefined : clone(v)) });
  const parent = p => p.slice(0, p.lastIndexOf('/'));
  const listeners = new Set();
  const notify = p => { for (const l of listeners) if (l.kind === 'doc' ? l.path === p : parent(p) === l.path) l.run(); };
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const colSnap = async cp => {
    const keys = (await kvKeys(cp + '/')).filter(k => !k.slice(cp.length + 1).includes('/')).sort();
    const vals = await Promise.all(keys.map(kvGet));
    const docs = keys.map((k, i) => snapOf(k, vals[i]));
    return { docs, size: docs.length, empty: !docs.length };
  };
  const sub = (kind, path, get, next, err) => {
    let seq = 0;
    const l = { kind, path, run: async () => { const my = ++seq; try { const s = await get(); if (my === seq && listeners.has(l)) next(s); } catch (e) { if (err) err(e); } } };
    listeners.add(l); l.run();
    return () => listeners.delete(l);
  };
  const doc = path => ({
    id: path.slice(path.lastIndexOf('/') + 1), path,
    get: async () => snapOf(path, await kvGet(path)),
    set: async d => { await kvPut(path, clone(d)); notify(path); },
    update: async d => {
      const cur = await kvGet(path);

    },
    delete: async () => { await kvDel(path); notify(path); },
    onSnapshot: (next, err) => sub('doc', path, async () => snapOf(path, await kvGet(path)), next, err),
    collection: n => col(path + '/' + n)
  });

    path,
    doc: id => doc(path + '/' + (id || rid())),
    get: () => colSnap(path),
    onSnapshot: (next, err) => sub('col', path, () => colSnap(path), next, err)
  });
  return { doc, collection: col, raw: { get: kvGet, put: kvPut, del: kvDel, keys: kvKeys } };
})();

const LS_BACKUP_KEYS = () => Object.keys(localStorage).filter(k => k.startsWith('tongye.'));
async function buildBackup(withKey) {
  const zip = new JSZip();
  const keys = await idb.raw.keys('');
  const kv = [];
  for (const k of keys) {
    const v = await idb.raw.get(k);
    if (k.startsWith('fontdata/')) zip.file('fonts/' + k.slice(9), v);
    else kv.push([k, v]);
  }
  zip.file('kv.json', JSON.stringify(kv));
  zip.file('skins.json', JSON.stringify(await skinDb.all()));
  const ls = {};
  for (const k of LS_BACKUP_KEYS()) { if (k === 'tongye.api' && !withKey) continue; try { ls[k] = localStorage.getItem(k); } catch (e) {} }
  if (ls['tongye.api'] === undefined && withKey === false) { /* skipped on purpose */ }
  zip.file('ls.json', JSON.stringify(ls));
  zip.file('info.json', JSON.stringify({ app: 'tongye', v: 1, at: Date.now(), books: kv.filter(x => /^data\/users\/[^/]+\/app\/books\/[^/]+$/.test(x[0])).length, key: !!withKey }));
  return zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 3 } });
}

  if (!a || typeof a !== 'object') return b;
  if (!b || typeof b !== 'object') return a;
  const o = Object.assign({}, a);
  for (const k of Object.keys(b)) o[k] = typeof b[k] === 'number' && typeof a[k] === 'number' ? Math.max(a[k], b[k]) : (a[k] === undefined ? b[k] : a[k]);
  return o;
};
async function restoreBackup(file) {
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const infoF = zip.file('info.json');
  if (!infoF) throw new Error('not-backup');
  const info = JSON.parse(await infoF.async('string'));
  if (info.app !== 'tongye') throw new Error('not-backup');
  const kv = JSON.parse(await zip.file('kv.json').async('string'));
  let n = 0;
  for (const [k, v] of kv) {
    let val = v;
    if (/\/stats\/reading$/.test(k)) {
      const cur = await idb.raw.get(k);
      if (cur) {
        val = Object.assign({}, v, cur);
        for (const f of ['days', 'hours', 'books', 'bd']) if (v[f] || cur[f]) val[f] = mergeMax(cur[f], v[f]);
        for (const f of ['reviews', 'stars', 'fin', 'start']) if (v[f] && typeof v[f] === 'object' && cur[f] && typeof cur[f] === 'object') val[f] = Object.assign({}, v[f], cur[f]);
      }
    }
    await idb.raw.put(k, val); n++;
  }
  for (const f of Object.keys(zip.files).filter(x => x.startsWith('fonts/') && !zip.files[x].dir)) {
    await idb.raw.put('fontdata/' + f.slice(6), await zip.file(f).async('arraybuffer'));
  }
  const sk = zip.file('skins.json');
  if (sk) for (const t of JSON.parse(await sk.async('string'))) { try { await skinDb.put(t); } catch (e) {} }
  const lsF = zip.file('ls.json');
  if (lsF) {
    const ls = JSON.parse(await lsF.async('string'));
    for (const k of Object.keys(ls)) { if (k === 'tongye.api' && localStorage.getItem('tongye.api')) continue; try { localStorage.setItem(k, ls[k]); } catch (e) {} }
  }
  return { n, books: info.books || 0 };
}

      if (!parsed.title) parsed.title = base;
    } else if (ext === 'txt') {

    } else throw new Error('type');

    for (let d = 0; d < docs.length; d++) {

async function annotateChapter(silent) {

        S.memo = out.memo.trim().slice(0, 800);
        dbCall(() => metaDoc(S.book.id, 'memo').set({ t: S.memo, mc: c, mp: readTo, at: Date.now() })).catch(() => {});
      }

const scrubDrag = { on: false };
function scrubFrac() {

}
function updateScrub() {

  box.hidden = !(S.view === 'reader' && S.chap && S.book);
  if (box.hidden || scrubDrag.on) return;
  const v = Math.round(clamp((S.ch + scrubFrac()) / S.book.nCh, 0, 1) * 1000);
  $('#scrubR').value = String(v);
  $('#scrubR').style.setProperty('--p', (v / 10) + '%');

}
let ticksFor = '';
function buildTicks() {

  if (!box || key === ticksFor) return;

}
function scrubLabel(v) {

}
async function scrubGo(v) {

}

    '选中的文字：\n「' + sel.q + '」',
    '要求：',
    '- 一定要结合上面的语境来译，不要只给词典义。注意：这个词/句在这里具体指什么、谁在说话、代词指代谁、语气（讽刺、客气、玩笑、感伤）、是不是习语、俚语或固定搭配、有没有双关。',
    '- 如果选中的是一个单词或短语：给出词性、结合这里语境的中文意思（和词典常见义不同的话，说明差别），读音或音标，再配一个简短例句和中文翻译。',
    '- 如果是句子或一段话：先给通顺自然、贴合语境的中文翻译，再用一两句话点出难点或语境带来的特殊含义，没有就不写。',
    '- 如果选中的本来就是中文：不翻译，直接结合上下文解释词义或典故。',
    '- 口语、简洁，不用标题和星号，不要提到这段之后的情节。只输出结果本身。'
  ].filter(Boolean).join('\n');
}
async function runTranslate() {
  const D = S.sheet;
  if (!D || D.kind !== 'translate' || !sample) return;
  if (S.ai.busy) { toast('克总还在想上一个。'); return; }
  D.text = ''; D.done = false; D.err = false;
  S.ai.busy = true; S.ai.ctl = new AbortController(); updateAiUi();
  buildSheet();
  try {
    const res = await sample(buildTranslatePrompt(D.sel), {
      signal: S.ai.ctl.signal, cache: false, modelTier: 'default',
      onText: ({ text }) => { D.text = text; const el = $('#trText'); if (el) el.textContent = text; }
    });
    D.text = res.text.trim(); D.done = true;
  } catch (e) { D.err = true; aiErr(e); }
  finally { S.ai.busy = false; S.ai.ctl = null; updateAiUi(); if (S.sheet === D) buildSheet(); }
}
async function saveTranslateNote() {
  const D = S.sheet, sel = D.sel;
  if (!D.text) return;
  const now = Date.now();
  const note = { ch: S.ch, p: sel.p, s: sel.s, e: sel.e, q: sel.q, by: 'ai', msgs: [{ by: 'ai', t: D.text.slice(0, 800), at: now }], at: now, upd: now };
  try {
    const ref = notesCol(S.book.id).doc();
    await dbCall(() => ref.set(note));
    upsertNote(Object.assign({ id: ref.id }, note));
    toast('存成批注了。'); closeSheet();
  } catch (e) { toast(e && e.code === 'quota_exceeded' ? '存储满了，删掉一本旧书再试。' : '没存上，再试一次。'); }
}
function buildTranslate() {
  const D = S.sheet;
  const el = h('div', { style: 'display:grid;gap:12px' },
    h('div', { class: 'quote me' }, h('small', { text: '第 ' + (S.ch + 1) + ' 章' }), D.sel.q));
  if (D.text) el.append(h('div', { class: 'msg ai' + (D.done ? '' : ' pending') }, h('span', { class: 'who' }, '克总', D.done ? null : h('span', { class: 'dot' })), h('div', { class: 'txt', id: 'trText', style: 'white-space:pre-wrap', text: D.text })));
  else if (!D.err) el.append(h('div', { class: 'msg ai pending' }, h('span', { class: 'who' }, '克总 ', h('span', { class: 'dot' })), h('div', { class: 'txt', id: 'trText', text: '正在翻…' })));
  else el.append(h('p', { class: 'fine', text: '这次没翻出来。' }));
  el.append(h('div', { class: 'acts' },
    h('button', { class: 'btn grow', type: 'button', disabled: S.ai.busy, text: '再翻一次', onclick: runTranslate }),
    D.done ? h('button', { class: 'btn grow primary', type: 'button', text: '存成批注', onclick: saveTranslateNote }) : null));
  return { title: '翻译', el };
}

/* ---------- wiring ---------- */
$('#backBtn').addEventListener('click', leaveReader);
$('#tocBtn').addEventListener('click', () => openSheet('toc'));
$('#notesBtn').addEventListener('click', () => openSheet('notes'));
$('#aiBtn').addEventListener('click', annotateChapter);
$('#settingsBtn').addEventListener('click', () => openSheet('settings'));
$('#statsBtn').addEventListener('click', () => { flushTime(); openSheet('stats'); });
$('#keepBtn').addEventListener('click', () => openSheet('keepbox', { tab: 'cur' }));
$('#selKeep').addEventListener('click', () => { const v = curSel(); if (v) openSheet('keep', { sel: v, mode: 'mat' }); });
$('#msBtn').addEventListener('click', () => { flushTime(); openSheet('miles'); });
$('#aaBtn').addEventListener('click', () => openSheet('type'));
$('#file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importFile(f); });
['pointerdown', 'touchstart'].forEach(ev => $('#selbar').addEventListener(ev, () => { selLock = Date.now(); if (S.sel) selSnap = S.sel; }, { passive: true, capture: true }));
const keepSel = e => e.preventDefault();
['selLine', 'selNote', 'selAsk', 'selCard', 'selTr', 'selKeep'].forEach(id => $('#' + id).addEventListener('mousedown', keepSel));
$('#selLine').addEventListener('click', async () => {
  const sel = curSel(); if (!sel) return;
  try { await createNote(sel, ''); clearSelection(); } catch (e) { toast(e && e.code === 'quota_exceeded' ? '存储满了，删掉一本旧书再试。' : '没存上，再试一次。'); }
});
$('#selCard').addEventListener('click', () => { const v = curSel(); if (v) cardFromSel(v); });
$('#selTr').addEventListener('click', () => { const v = curSel(); if (v) { openSheet('translate', { sel: v, text: '', done: false }); runTranslate(); } });
$('#selNote').addEventListener('click', () => { const v = curSel(); if (v) openSheet('compose', { sel: v, ask: false }); });
$('#selAsk').addEventListener('click', () => { const v = curSel(); if (v) openSheet('compose', { sel: v, ask: true }); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { flushTime(); flushProgress(); } });
addEventListener('pagehide', () => { flushTime(); flushProgress(); });

/* ---------- boot ---------- */
window.__tongye = { S, markFin, drawMiles, msItems, renderLibrary, setStars, setReview, genCover };
(async function boot() {
  loadRd(); applyRd(); loadSkins(); splLoad(); grpLoad(); splashShow();
  renderLibrary();
  const [dbm, userm, samp, dl] = await Promise.all([use('db'), use('user'), use('sample'), use('downloads')]);
  uid = userm ? await userm.id() : null;
  if (!dbm || !uid) {
    $('#libBody').replaceChildren(h('p', { class: 'nostore', text: '书架需要在 Claude 里登录后才能保存。请在 Claude 里打开这个页面。' }));
    return;
  }
  db = dbm; sample = samp; downloads = dl;
  S.canDl = !!dl;
  if (isStandalone()) { try { await loadCustomFonts(); applyRd(); } catch (e) {} }
  root = db.doc('data/users/' + uid + '/app');
  setView('lib');
  applyAiVisibility();
  try {
    const s = await dbCall(() => statsDoc().get());
    if (s.exists) { const d = JSON.parse(JSON.stringify(s.data())); S.stats = { days: d.days || {}, hours: d.hours || {}, books: d.books || {}, fin: d.fin || {}, stars: d.stars || {}, start: d.start || {}, bd: d.bd || {}, reviews: d.reviews || {}, goal: typeof d.goal === 'number' ? d.goal : 0, density: DENS[d.density] ? d.density : 'mid', persona: typeof d.persona === 'string' ? d.persona : '' }; }
    else await dbCall(() => statsDoc().set({ days: {}, hours: {}, goal: 0 }));
    S.statsReady = true;
  } catch (e) {}
  try {
    const k = await dbCall(() => keepDoc().get());
    if (k.exists) { const d = JSON.parse(JSON.stringify(k.data())); S.keep = { cur: d.cur || [], mat: d.mat || [] }; }
    S.keepReady = true;
  } catch (e) {}
  booksCol().onSnapshot(snap => {
    S.books = snap.docs.map(d => Object.assign({ id: d.id }, JSON.parse(JSON.stringify(d.data())))).sort((a, b) => ((S.progress[b.id] && S.progress[b.id].at) || b.at) - ((S.progress[a.id] && S.progress[a.id].at) || a.at));
    if (S.view === 'lib') renderLibrary();
    loadProgressFor(S.books);
    if (!S.qBack && S.books.length) { S.qBack = true; setTimeout(backfillQuotes, 1500); }
  }, () => { toast('书架没连上，刷新页面再试。'); });
  renderLibrary();
})();
})();
</script>
